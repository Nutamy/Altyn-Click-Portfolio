<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Liquid Glass tile: violet → blue, light glowing from inside -->
    <linearGradient id="base" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CF7"/>
      <stop offset=".55" stop-color="#6A66F4"/>
      <stop offset="1" stop-color="#4F63EE"/>
    </linearGradient>
    <radialGradient id="cyan" cx="410" cy="110" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68DDD7" stop-opacity=".75"/>
      <stop offset="1" stop-color="#68DDD7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="70" cy="470" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9A6E7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E9A6E7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2A2A8C" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#base)"/>
  <rect width="512" height="512" rx="120" fill="url(#cyan)"/>
  <rect width="512" height="512" rx="120" fill="url(#pink)"/>
  <path d="M120 0h272a120 120 0 0 1 120 120v40C400 220 220 230 0 190V120A120 120 0 0 1 120 0Z" fill="url(#gloss)"/>
  <rect x="5" y="5" width="502" height="502" rx="115" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <!-- Brand mark: cursor with click rays -->
  <g transform="translate(262 268) scale(.6) translate(-604 -600)" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#lift)">
      <path d="M508 484L636 856L708 726L846 676Z" fill="#fff" stroke="#fff" stroke-width="56"/>
      <path d="M728 740L818 850" fill="none" stroke="#fff" stroke-width="64"/>
    </g>
    <path d="M502 342V418M600 456L648 408M362 495H442" fill="none" stroke="#FFC861" stroke-width="56"/>
  </g>
</svg>
